<body class="text-slate-100 min-h-screen antialiased selection:bg-cyan-500 selection:text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ============================================================================
        // CIVIL HYDROLOGICAL FORMULAS & CONSTANTS (IS 7323 & CWC Guidelines)
        // ============================================================================
        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return parseFloat((R * c).toFixed(2));
        }

        function calculateWaveArrival(distanceKm, dischargeCusecs) {
            if (dischargeCusecs <= 500) {
                return { arrivalMinutes: null, speedKmh: 0, statusText: "Spillway Gates Closed" };
            }
            let speedKmh = 7.5;
            if (dischargeCusecs > 20000) speedKmh = 9.0;
            if (dischargeCusecs > 50000) speedKmh = 11.5;
            if (dischargeCusecs > 80000) speedKmh = 14.0;

            const arrivalMinutes = Math.round((distanceKm / speedKmh) * 60);
            let statusText = "";
            if (arrivalMinutes < 30) {
                statusText = `CRITICAL: Reaching plot in ${arrivalMinutes} mins!`;
            } else if (arrivalMinutes < 60) {
                statusText = `HIGH ALERT: Reaching plot in ${arrivalMinutes} mins.`;
            } else {
                const hrs = (arrivalMinutes / 60).toFixed(1);
                statusText = `ADVISORY: Reaching plot in approx ${hrs} hours.`;
            }

            return { arrivalMinutes, speedKmh, statusText };
        }

        function evaluateReservoirStatus(dam) {
            const { currentTmc, maxCapacityTmc, inflowCusecs, outflowCusecs, season } = dam;
            const fillPercentage = parseFloat(((currentTmc / maxCapacityTmc) * 100).toFixed(1));

            let alertLevel = "GREEN";
            let alertTitle = "NORMAL SAFE STAGE";
            let summaryMessage = "Reservoir storage and spillway discharge are within safe operating limits.";
            let gateStatus = "Spillway Gates Closed / River Base Flow Only";

            if (season === "monsoon") {
                if (fillPercentage >= 95 || (fillPercentage >= 88 && inflowCusecs > 50000) || outflowCusecs >= 50000) {
                    alertLevel = "RED";
                    alertTitle = "EMERGENCY: RED FLOOD ALERT";
                    summaryMessage = `Peak Monsoon Crest! Storage at ${fillPercentage}% (${currentTmc} TMC). High spillway release (${outflowCusecs.toLocaleString()} cusecs). Floodplain evacuation mandatory!`;
                    gateStatus = "Crest Radial Gates Fully Opened (High Discharge)";
                } else if (fillPercentage >= 85 || inflowCusecs > 35000 || outflowCusecs >= 25000) {
                    alertLevel = "ORANGE";
                    alertTitle = "WARNING: ORANGE ALERT";
                    summaryMessage = `Storage at ${fillPercentage}%. High inflow (${inflowCusecs.toLocaleString()} cusecs). Spillway discharge active. Move livestock & pump sets.`;
                    gateStatus = "Spillway Radial Gates Partially Opened";
                } else if (fillPercentage >= 75 || inflowCusecs > 20000) {
                    alertLevel = "YELLOW";
                    alertTitle = "ADVISORY: YELLOW MONITORING";
                    summaryMessage = `Storage at ${fillPercentage}%. Inflow steady. Early warning advisory to low-lying farmers.`;
                    gateStatus = "Canal Sluices Active / Spillway Standby";
                } else {
                    alertLevel = "GREEN";
                    alertTitle = "NORMAL: GREEN STAGE";
                    summaryMessage = `Storage at ${fillPercentage}%. Reservoir safely absorbing catchment inflow.`;
                    gateStatus = "Spillway Closed / River Base Flow Only";
                }
            } else if (season === "winter") {
                if (fillPercentage >= 98 || outflowCusecs >= 40000) {
                    alertLevel = "RED";
                    alertTitle = "EMERGENCY: OVERFLOW RED ALERT";
                    summaryMessage = `Winter conservation capacity exceeded (${fillPercentage}%). Emergency spillway bypass active.`;
                    gateStatus = "Spillway Gates Open";
                } else if (fillPercentage >= 92 || outflowCusecs >= 20000) {
                    alertLevel = "ORANGE";
                    alertTitle = "CAUTION: HIGH WINTER STORAGE";
                    summaryMessage = `Dam held at ${fillPercentage}% for Rabi irrigation supply. Downstream canals running at full capacity.`;
                    gateStatus = "Irrigation Canals Full Supply Depth";
                } else {
                    alertLevel = "GREEN";
                    alertTitle = "OPTIMAL: WINTER CONSERVATION";
                    summaryMessage = `Storage at ${fillPercentage}%. Water conserved for agricultural feeding.`;
                    gateStatus = "Controlled Discharge";
                }
            } else { // Summer
                if (outflowCusecs > 15000) {
                    alertLevel = "ORANGE";
                    alertTitle = "CANAL SURGE ALERT: SUMMER";
                    summaryMessage = `Sudden heavy release into irrigation canals. Farmers along canals advised caution.`;
                    gateStatus = "Emergency Canal Flushing";
                } else if (fillPercentage < 20) {
                    alertLevel = "YELLOW";
                    alertTitle = "DROUGHT ADVISORY: LOW STORAGE";
                    summaryMessage = `Reservoir at ${fillPercentage}% (Conservation / Dead storage pool). Water strictly rationed.`;
                    gateStatus = "Drinking Water Sluice Only";
                } else {
                    alertLevel = "GREEN";
                    alertTitle = "NORMAL: SUMMER STAGE";
                    summaryMessage = `Storage at ${fillPercentage}%. Rotational irrigation active.`;
                    gateStatus = "Rotational Canal Release";
                }
            }

            return { fillPercentage, alertLevel, alertTitle, summaryMessage, gateStatus };
        }

        function evaluateFarmerRisk(farmer, damStatus, outflowCusecs) {
            const { distanceKm } = farmer;
            const river_dist = farmer.distanceFromRiverMeters || 300;
            const wave = calculateWaveArrival(distanceKm, outflowCusecs);

            let riskTier = "SAFE";
            let badgeColor = "green";
            let action = "Conditions normal. Regular farming activities can continue.";

            if (damStatus.alertLevel === "RED") {
                if (distanceKm <= 2.0 || river_dist <= 250) {
                    riskTier = "CRITICAL";
                    badgeColor = "red";
                    action = "🚨 IMMEDIATE EVACUATION: Flash flood danger! Unchain cattle, disconnect electric pump motors, move to high ground immediately!";
                } else if (distanceKm <= 5.0 || river_dist <= 600) {
                    riskTier = "WARNING";
                    badgeColor = "orange";
                    action = "⚠️ PREPARE TO EVACUATE: Move cattle, pump motors, and machinery to higher elevation. Keep torches and battery sets ready.";
                } else {
                    riskTier = "ADVISORY";
                    badgeColor = "yellow";
                    action = "📢 FLOOD ADVISORY: Stay clear of canal banks and river crossings.";
                }
            } else if (damStatus.alertLevel === "ORANGE") {
                if (distanceKm <= 2.0) {
                    riskTier = "WARNING";
                    badgeColor = "orange";
                    action = "⚠️ CAUTION: Spillway active. Stay clear of riverbank fields.";
                } else if (distanceKm <= 5.0) {
                    riskTier = "ADVISORY";
                    badgeColor = "yellow";
                    action = "📢 ADVISORY: River channel rising. Secure irrigation pipes.";
                } else {
                    riskTier = "SAFE";
                    badgeColor = "green";
                    action = "Normal vigilance. Follow local village panchayat announcements.";
                }
            } else if (damStatus.alertLevel === "YELLOW") {
                if (distanceKm <= 2.0) {
                    riskTier = "ADVISORY";
                    badgeColor = "yellow";
                    action = "📢 EARLY NOTICE: Catchment heavy rain. Dam gates may open in 12-24h.";
                } else {
                    riskTier = "SAFE";
                    badgeColor = "green";
                    action = "Safe. Regular operations.";
                }
            } else {
                riskTier = "SAFE";
                badgeColor = "green";
                action = "Green Safe Zone. Normal irrigation schedule active.";
            }

            return { riskTier, badgeColor, actionRecommendation: action, waveArrival: wave };
        }

        const INITIAL_DAM = {
            id: "DAM-KRS-001",
            name: "Krishnarajasagara (KRS) Dam",
            river: "Cauvery River Basin",
            district: "Mandya / Mysuru",
            state: "Karnataka",
            latitude: 12.2707,
            longitude: 76.5742,
            fullReservoirLevelMeters: 124.80,
            maxWaterLevelMeters: 125.50,
            deadStorageTmc: 4.38,
            maxCapacityTmc: 49.45,
            currentTmc: 46.80,
            waterLevelMeters: 123.90,
            inflowCusecs: 48000,
            outflowCusecs: 38000,
            season: "monsoon"
        };

        // ============================================================================
        // MAIN APP COMPONENT
        // ============================================================================
        function App() {
            // localhost may resolve to the separate Node demo listener on IPv6.
            // Route local dashboard API calls directly to the Python alert server.
            const apiFetch = (path, options = {}) => {
                const token = sessionStorage.getItem('jalsuraksha-admin-token');
                const headers = { ...(options.headers || {}) };
                if (token) headers.Authorization = `Bearer ${token}`;
                return fetch(`${window.location.hostname === "localhost" ? "http://127.0.0.1:5000" : ""}${path}`, { ...options, headers });
            };
            const [adminAuthenticated, setAdminAuthenticated] = useState(false);
            const [authChecked, setAuthChecked] = useState(false);
            const [adminUsername, setAdminUsername] = useState('admin');
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');
            const [adminLoginBusy, setAdminLoginBusy] = useState(false);
            const [dam, setDam] = useState(INITIAL_DAM);
            const [farmers, setFarmers] = useState([]);
            const [activeTab, setActiveTab] = useState("dashboard");
            const [alertLog, setAlertLog] = useState([]);
            const [sirenPlaying, setSirenPlaying] = useState(false);
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [isBroadcasting, setIsBroadcasting] = useState(false);
            const [envStatus, setEnvStatus] = useState({ smtpConfigured: false, smsConfigured: false, smtpUser: "Loading..." });
            const [lastModalAlert, setLastModalAlert] = useState(null);
            const [searchFilter, setSearchFilter] = useState("");
            
            // Map Tile Themes
            const [mapTheme, setMapTheme] = useState('dark'); // 'dark' | 'street' | 'satellite'

            // Live GPS Current Location State
            const [userLocation, setUserLocation] = useState(null);
            const [gpsLoading, setGpsLoading] = useState(false);

            // Registration form state
            const [regForm, setRegForm] = useState({
                name: "",
                phone: "+91",
                email: "",
                surveyNumber: "",
                village: "",
                cropType: "Sugarcane",
                landAreaAcres: 3.5,
                latitude: 12.2680,
                longitude: 76.5910,
                distanceFromRiverMeters: 200,
                notes: ""
            });

            const leafletMap = useRef(null);
            const tileLayerRef = useRef(null);
            const markersLayer = useRef(null);
            const userMarkerLayer = useRef(null);
            const sirenOscRef = useRef(null);

            // Base Map Tile URLs
            const TILE_PROVIDERS = {
                dark: {
                    // OpenStreetMap with dark CSS filter applied via Leaflet pane
                    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    attrib: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    filter: 'brightness(0.55) invert(1) contrast(3) hue-rotate(200deg) saturate(0.25) brightness(0.7)'
                },
                street: {
                    // OpenStreetMap Standard — FREE, no API key, universal coverage
                    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    attrib: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    filter: 'none'
                },
                satellite: {
                    // Esri World Imagery — FREE, no API key
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    attrib: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS',
                    filter: 'none'
                }
            };

            // Fetch live farmers & env status
            const refreshData = () => {
                apiFetch('/api/farmers')
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.farmers && data.farmers.length > 0) {
                            setFarmers(data.farmers);
                        }
                    })
                    .catch(err => console.log('Backend sync error:', err));

                apiFetch('/api/env-status')
                    .then(r => r.json())
                    .then(data => setEnvStatus(data))
                    .catch(() => setEnvStatus({ smtpConfigured: false, smsConfigured: false, smtpUser: "API unavailable" }));
            };

            const handleAdminLogin = async (event) => {
                event.preventDefault();
                setAdminLoginBusy(true);
                setAdminLoginError('');
                try {
                    const response = await apiFetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: adminUsername, password: adminPassword })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Sign-in failed.');
                    sessionStorage.setItem('jalsuraksha-admin-token', data.token);
                    setAdminPassword('');
                    setAdminAuthenticated(true);
                } catch (error) {
                    setAdminLoginError(error.message || 'Could not connect to the admin API.');
                } finally {
                    setAdminLoginBusy(false);
                }
            };

            const handleAdminLogout = () => {
                apiFetch('/api/admin/logout', { method: 'POST' }).catch(() => {});
                sessionStorage.removeItem('jalsuraksha-admin-token');
                setAdminAuthenticated(false);
                setAuthChecked(true);
            };

            useEffect(() => {
                const token = sessionStorage.getItem('jalsuraksha-admin-token');
                if (!token) {
                    setAuthChecked(true);
                    return;
                }
                apiFetch('/api/admin/session')
                    .then(response => { if (!response.ok) throw new Error('Session expired'); setAdminAuthenticated(true); })
                    .catch(() => { sessionStorage.removeItem('jalsuraksha-admin-token'); setAdminAuthenticated(false); })
                    .finally(() => setAuthChecked(true));
            }, []);

            useEffect(() => {
                if (!adminAuthenticated) return;
                refreshData();
                const refreshTimer = setInterval(refreshData, 15000);
                return () => clearInterval(refreshTimer);
            }, [adminAuthenticated]);

            // Handle tab changes & map resize
            useEffect(() => {
                if (activeTab === 'dashboard' && leafletMap.current) {
                    setTimeout(() => {
                        leafletMap.current.invalidateSize();
                    }, 200);
                }
            }, [activeTab]);

            // Switch Tile Themes
            useEffect(() => {
                if (leafletMap.current && tileLayerRef.current) {
                    leafletMap.current.removeLayer(tileLayerRef.current);
                    const provider = TILE_PROVIDERS[mapTheme] || TILE_PROVIDERS.dark;
                    const newLayer = L.tileLayer(provider.url, { attribution: provider.attrib }).addTo(leafletMap.current);
                    tileLayerRef.current = newLayer;
                    // Apply CSS filter for dark mode
                    setTimeout(() => {
                        const tilePane = leafletMap.current.getPanes().tilePane;
                        if (tilePane) tilePane.style.filter = provider.filter || 'none';
                    }, 100);
                }
            }, [mapTheme]);

            // Compute Hydrological Evaluation
            const evaluation = useMemo(() => evaluateReservoirStatus(dam), [dam]);

            // Enrich farmers with live distance & risk
            const enrichedFarmers = useMemo(() => {
                return farmers.map(f => {
                    const dist = calculateHaversineDistance(dam.latitude, dam.longitude, f.latitude, f.longitude);
                    const farmerWithDist = { ...f, distanceKm: dist };
                    const risk = evaluateFarmerRisk(farmerWithDist, evaluation, dam.outflowCusecs);
                    return { ...farmerWithDist, riskAssessment: risk };
                });
            }, [farmers, dam, evaluation]);

            // Filtered farmers for table
            const filteredFarmers = useMemo(() => {
                if (!searchFilter.trim()) return enrichedFarmers;
                const q = searchFilter.toLowerCase();
                return enrichedFarmers.filter(f => 
                    (f.name && f.name.toLowerCase().includes(q)) ||
                    (f.surveyNumber && f.surveyNumber.toLowerCase().includes(q)) ||
                    (f.village && f.village.toLowerCase().includes(q)) ||
                    (f.phone && f.phone.includes(q))
                );
            }, [enrichedFarmers, searchFilter]);

            // Siren Audio Synthesizer
            const toggleSiren = () => {
                if (sirenPlaying) {
                    if (sirenOscRef.current) {
                        sirenOscRef.current.stop();
                        sirenOscRef.current.disconnect();
                        sirenOscRef.current = null;
                    }
                    setSirenPlaying(false);
                } else {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        const ctx = new AudioCtx();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "sawtooth";
                        
                        const now = ctx.currentTime;
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.linearRampToValueAtTime(950, now + 0.6);
                        osc.frequency.linearRampToValueAtTime(600, now + 1.2);
                        
                        gain.gain.setValueAtTime(0.15, now);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        sirenOscRef.current = osc;
                        setSirenPlaying(true);
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            // ========================================================================
            // 🎯 LIVE GPS / CURRENT LOCATION ENGINE
            // ========================================================================
            const detectCurrentLocation = (target = 'map') => {
                setGpsLoading(true);

                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser. Using simulated riverbank coordinates.");
                    applySimulatedLocation(target);
                    setGpsLoading(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = parseFloat(pos.coords.latitude.toFixed(4));
                        const lng = parseFloat(pos.coords.longitude.toFixed(4));
                        applyLocationData(lat, lng, pos.coords.accuracy, target);
                        setGpsLoading(false);
                    },
                    (err) => {
                        console.warn("GPS error:", err);
                        // Seamless fallback for indoor hackathons / no hardware GPS
                        applySimulatedLocation(target);
                        setGpsLoading(false);
                    },
                    { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
                );
            };

            const applySimulatedLocation = (target) => {
                const simLat = 12.2680;
                const simLng = 76.5910;
                applyLocationData(simLat, simLng, 15, target, true);
            };

            window.testRiverbankGPS = () => applySimulatedLocation('map');

            const applyLocationData = (lat, lng, accuracy, target, isSimulated = false) => {
                const dist = calculateHaversineDistance(dam.latitude, dam.longitude, lat, lng);
                const wave = calculateWaveArrival(dist, dam.outflowCusecs);
                const risk = evaluateFarmerRisk({ distanceKm: dist, distanceFromRiverMeters: 200 }, evaluation, dam.outflowCusecs);

                const locInfo = {
                    lat,
                    lng,
                    accuracy: Math.round(accuracy || 20),
                    distanceKm: dist,
                    waveArrival: wave,
                    riskTier: risk.riskTier,
                    action: risk.actionRecommendation,
                    isSimulated,
                    timestamp: new Date().toLocaleTimeString()
                };

                setUserLocation(locInfo);

                if (target === 'register') {
                    setRegForm(prev => ({
                        ...prev,
                        latitude: lat,
                        longitude: lng,
                        village: prev.village || (isSimulated ? "Belagola Downstream" : "Live Device GPS")
                    }));
                }

                // If on Map, animate to location and show custom user pulse marker
                if (leafletMap.current) {
                    if (userMarkerLayer.current) {
                        userMarkerLayer.current.clearLayers();
                    } else {
                        userMarkerLayer.current = L.layerGroup().addTo(leafletMap.current);
                    }

                    const userIcon = L.divIcon({
                        className: 'user-gps-marker',
                        html: `
                            <div class="relative flex items-center justify-center">
                                <div class="absolute w-14 h-14 rounded-full bg-cyan-400/35 pulse-user"></div>
                                <div class="relative w-9 h-9 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 border-2 border-white shadow-2xl flex items-center justify-center text-sm font-black text-white ring-4 ring-cyan-500/30">
                                    🎯
                                </div>
                            </div>
                        `,
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    });

                    const etaText = wave.arrivalMinutes ? `${wave.arrivalMinutes} mins` : "Gates Closed";
                    
                    const popupContainer = document.createElement('div');
                    popupContainer.className = 'text-slate-900 font-sans p-1 text-sm';
                    popupContainer.innerHTML = `
                        <div class="flex items-center space-x-1.5 font-black text-base text-cyan-700">
                            <span>🎯</span>
                            <span>${isSimulated ? "Simulated Downstream Plot (Belagola)" : "You Are Here (Live Device GPS)"}</span>
                        </div>
                        <div class="mt-2 text-xs border-t border-slate-200 pt-1.5 space-y-1">
                            <div><b>GPS Coordinates:</b> <span class="font-mono text-slate-800">${lat}° N, ${lng}° E</span></div>
                            <div><b>Distance from KRS Dam:</b> <span class="font-bold text-slate-900">${dist} km</span></div>
                            <div><b>Flood Wave Arrival ETA:</b> <span class="font-bold text-red-600 font-mono">${etaText}</span></div>
                            <div><b>Assessed Risk Tier:</b> <span class="font-bold uppercase ${risk.riskTier === 'CRITICAL' ? 'text-red-600 font-black' : 'text-amber-600'}">${risk.riskTier}</span></div>
                        </div>
                        <div class="mt-2 text-[11px] bg-slate-100 p-2 rounded-lg border border-slate-200 text-slate-700">
                            ${risk.actionRecommendation}
                        </div>
                        ${dist > 25 ? `
                            <div class="mt-2 pt-2 border-t border-slate-200">
                                <div class="text-[10px] text-amber-700 font-medium">📍 Notice: Device is ${dist} km away (outside Cauvery basin).</div>
                                <button onclick="window.testRiverbankGPS()" class="mt-1 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-1.5 px-2 rounded text-xs transition">
                                    Simulate at Belagola Riverbank (1.85 km) 🌊
                                </button>
                            </div>
                        ` : ''}
                    `;

                    const testAlertBtn = document.createElement('button');
                    testAlertBtn.className = 'mt-3 w-full text-center bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-2 px-3 rounded-lg text-xs shadow-lg flex items-center justify-center space-x-1.5 transition transform active:scale-95';
                    testAlertBtn.innerHTML = '<span>⚡</span><span>Test 1-Click 3-Way Alert to My Device</span>';
                    testAlertBtn.onclick = () => {
                        const ownEmail = regForm.email.trim().toLowerCase();
                        const ownPhone = regForm.phone.replace(/\D/g, '');
                        const hasOwnPhone = ownPhone.length >= 10;
                        const matches = enrichedFarmers.filter(f => {
                            const emailMatches = ownEmail && String(f.email || '').trim().toLowerCase() === ownEmail;
                            const savedPhone = String(f.phone || '').replace(/\D/g, '');
                            const phoneMatches = hasOwnPhone && savedPhone.slice(-10) === ownPhone.slice(-10);
                            return ownEmail && hasOwnPhone ? emailMatches && phoneMatches : emailMatches || phoneMatches;
                        });
                        if (matches.length !== 1) {
                            alert('Register your own phone and email in Farmers & Land Survey Registry first. The test alert was not sent because a unique matching contact was not found.');
                            return;
                        }
                        handleSingleFarmer3WayAlert(matches[0]);
                    };
                    popupContainer.appendChild(testAlertBtn);

                    const uMarker = L.marker([lat, lng], { icon: userIcon })
                        .bindPopup(popupContainer);
                    
                    userMarkerLayer.current.addLayer(uMarker);

                    leafletMap.current.flyTo([lat, lng], dist > 25 ? 12 : 14, {
                        animate: true,
                        duration: 1.2
                    });

                    setTimeout(() => {
                        uMarker.openPopup();
                    }, 1300);
                }
            };

            // Initialize Leaflet Map
            useEffect(() => {
                if (!leafletMap.current && document.getElementById('map')) {
                    // Center firmly on KRS Dam with optimal zoom
                    const map = L.map('map', {
                        center: [dam.latitude, dam.longitude],
                        zoom: 13,
                        minZoom: 10,
                        maxZoom: 18,
                        zoomControl: false // custom position
                    });

                    // Add Zoom Control at bottom right
                    L.control.zoom({ position: 'bottomright' }).addTo(map);

                    // Initial Tile Layer
                    const provider = TILE_PROVIDERS[mapTheme] || TILE_PROVIDERS.dark;
                    const tileLayer = L.tileLayer(provider.url, { attribution: provider.attrib }).addTo(map);
                    tileLayerRef.current = tileLayer;
                    // Apply dark filter initially
                    setTimeout(() => {
                        const tilePane = map.getPanes().tilePane;
                        if (tilePane) tilePane.style.filter = provider.filter || 'none';
                    }, 200);

                    // Add KRS Dam Marker with glowing wave icon
                    const damIcon = L.divIcon({
                        className: 'custom-dam-marker',
                        html: `
                            <div class="relative flex items-center justify-center">
                                <div class="absolute w-14 h-14 rounded-full bg-cyan-500/25 pulse-user"></div>
                                <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 text-white shadow-2xl border-2 border-white flex items-center justify-center text-sm font-black ring-4 ring-cyan-500/30">
                                    🌊
                                </div>
                            </div>
                        `,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });

                    L.marker([dam.latitude, dam.longitude], { icon: damIcon })
                        .addTo(map)
                        .bindPopup(`
                            <div class="text-slate-900 font-sans p-1 text-sm">
                                <div class="font-black text-base text-cyan-700">${dam.name}</div>
                                <div class="text-xs text-slate-600">${dam.river} &bull; ${dam.district}</div>
                                <div class="mt-2 text-xs border-t border-slate-200 pt-1 space-y-1">
                                    <div><b>Full Reservoir Level:</b> ${dam.fullReservoirLevelMeters} m</div>
                                    <div><b>Gross Storage Capacity:</b> ${dam.maxCapacityTmc} TMC</div>
                                    <div><b>Current Telemetry:</b> <span class="text-cyan-700 font-bold">${dam.currentTmc} TMC (${evaluation.fillPercentage}%)</span></div>
                                </div>
                            </div>
                        `);

                    // 0-2km Red Critical Floodplain Buffer
                    L.circle([dam.latitude, dam.longitude], {
                        radius: 2000,
                        color: '#ef4444',
                        fillColor: '#ef4444',
                        fillOpacity: 0.16,
                        weight: 2,
                        dashArray: '6, 6'
                    }).addTo(map).bindPopup("<b>Zone 1 (0 - 2 km): Critical Floodplain</b><br>Mandatory Evacuation Zone");

                    // 2-5km Orange Warning Buffer
                    L.circle([dam.latitude, dam.longitude], {
                        radius: 5000,
                        color: '#f97316',
                        fillColor: '#f97316',
                        fillOpacity: 0.10,
                        weight: 2,
                        dashArray: '6, 6'
                    }).addTo(map).bindPopup("<b>Zone 2 (2 - 5 km): Agricultural Buffer</b><br>Equipment & Livestock Relocation");

                    // 5-10km Yellow Advisory Command Area
                    L.circle([dam.latitude, dam.longitude], {
                        radius: 10000,
                        color: '#eab308',
                        fillColor: '#eab308',
                        fillOpacity: 0.04,
                        weight: 1.5,
                        dashArray: '8, 8'
                    }).addTo(map).bindPopup("<b>Zone 3 (5 - 10 km): Canal Command Area</b>");

                    markersLayer.current = L.layerGroup().addTo(map);
                    leafletMap.current = map;

                    // Force correct size + zoom after DOM settles (fixes blank map on first load)
                    setTimeout(() => {
                        map.invalidateSize();
                        map.setView([dam.latitude, dam.longitude], 13);
                    }, 300);

                    // Click on map to pick coordinates
                    map.on('click', (e) => {
                        setRegForm(prev => ({
                            ...prev,
                            latitude: parseFloat(e.latlng.lat.toFixed(4)),
                            longitude: parseFloat(e.latlng.lng.toFixed(4))
                        }));
                    });
                }
            }, []);

            // Update Farmer Markers on Map (With Safe Bound Clamping!)
            useEffect(() => {
                if (leafletMap.current && markersLayer.current && enrichedFarmers.length > 0) {
                    markersLayer.current.clearLayers();

                    const validLayers = [];

                    enrichedFarmers.forEach(f => {
                        // Skip if coordinate is abnormal
                        if (isNaN(f.latitude) || isNaN(f.longitude)) return;
                        if (f.latitude < -90 || f.latitude > 90 || f.longitude < -180 || f.longitude > 180) return;

                        const isVinay = f.name && f.name.toLowerCase().includes('vinay');
                        let colorClass = isVinay ? "bg-cyan-500 border-yellow-300 ring-4 ring-yellow-400/40" : "bg-emerald-500 border-white";
                        let pulseClass = isVinay ? "pulse-user" : "";

                        if (f.riskAssessment.riskTier === "CRITICAL") {
                            colorClass = "bg-rose-600 border-rose-200 ring-4 ring-rose-500/40";
                            pulseClass = "pulse-danger";
                        } else if (f.riskAssessment.riskTier === "WARNING") {
                            colorClass = "bg-amber-500 border-amber-200";
                        } else if (f.riskAssessment.riskTier === "ADVISORY") {
                            colorClass = "bg-yellow-500 border-yellow-200";
                        }

                        const markerIcon = L.divIcon({
                            className: 'farmer-marker',
                            html: `
                                <div class="relative flex items-center justify-center">
                                    <div class="${colorClass} ${pulseClass} text-white rounded-2xl p-1 shadow-2xl border-2 flex items-center justify-center text-xs font-black w-8 h-8 transition-transform hover:scale-110">
                                        🌾
                                    </div>
                                </div>
                            `,
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        const wave = f.riskAssessment.waveArrival;
                        const eta = wave.arrivalMinutes ? `${wave.arrivalMinutes} mins` : "Closed";

                        const popupContent = document.createElement('div');
                        popupContent.className = 'text-slate-900 font-sans p-1 text-sm';
                        popupContent.innerHTML = `
                            <div class="font-black text-base text-slate-900 flex items-center justify-between">
                                <span>${f.name}</span>
                                ${isVinay ? '<span class="text-[10px] bg-yellow-100 text-yellow-800 border border-yellow-300 px-1.5 py-0.5 rounded font-bold">⭐ You</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-500">Survey No: <b class="text-slate-800">${f.surveyNumber}</b> &bull; ${f.village}</div>
                            <div class="mt-2 text-xs border-t border-slate-200 pt-1.5 space-y-1">
                                <div><b>Phone:</b> ${f.phone} (SMS & WhatsApp)</div>
                                <div><b>Email:</b> ${f.email}</div>
                                <div><b>Distance from Dam:</b> <span class="font-bold text-slate-900">${f.distanceKm} km</span></div>
                                <div><b>Flood Wave Arrival:</b> <span class="text-red-600 font-bold">${eta}</span></div>
                                <div><b>Crop:</b> ${f.cropType} (${f.landAreaAcres} Acres)</div>
                                <div><b>Risk Tier:</b> <span class="font-bold uppercase ${f.riskAssessment.riskTier === 'CRITICAL' ? 'text-red-600' : 'text-amber-600'}">${f.riskAssessment.riskTier}</span></div>
                            </div>
                        `;

                        const btn3Way = document.createElement('button');
                        btn3Way.className = 'mt-3 w-full text-center bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-2 px-3 rounded-lg text-xs shadow-lg flex items-center justify-center space-x-1.5 transition transform active:scale-95';
                        btn3Way.innerHTML = '<span>⚡</span><span>1-Click 3-Way Alert (SMS+WA+Email)</span>';
                        btn3Way.onclick = () => handleSingleFarmer3WayAlert(f);
                        popupContent.appendChild(btn3Way);

                        const marker = L.marker([f.latitude, f.longitude], { icon: markerIcon })
                            .bindPopup(popupContent);
                        
                        markersLayer.current.addLayer(marker);

                        // Only consider points within 30km of dam for bounding
                        if (f.distanceKm <= 30) {
                            validLayers.push(marker);
                        }
                    });

                    // Safely fit bounds within local Cauvery downstream basin
                    if (validLayers.length > 0) {
                        try {
                            const group = new L.featureGroup(validLayers);
                            group.addLayer(L.marker([dam.latitude, dam.longitude]));
                            leafletMap.current.fitBounds(group.getBounds().pad(0.12), {
                                maxZoom: 14
                            });
                        } catch (e) {}
                    }
                }
            }, [enrichedFarmers]);

            // ========================================================================
            // ⚡ 1-CLICK 3-WAY ALERT ENGINE (SMS + WHATSAPP + GMAIL SMTP)
            // ========================================================================
            const handleSingleFarmer3WayAlert = async (farmer) => {
                const wave = farmer.riskAssessment.waveArrival;
                const eta = wave.arrivalMinutes ? `~${wave.arrivalMinutes} mins` : "Gates Closed";
                const phoneDigits = farmer.phone.replace(/[^0-9]/g, '');

                // 1. Prepare WhatsApp Web URL & Open Tab
                const waMsg = `🌊 *JAL-SURAKSHA FLOOD ALERT* - ${dam.name}\nNamaskara *${farmer.name}*,\n📍 *Survey Plot*: ${farmer.surveyNumber} (${farmer.village})\n⚠️ *Status*: ${evaluation.alertTitle}\n💧 *Storage*: ${dam.currentTmc} TMC (${evaluation.fillPercentage}% Capacity)\n🚪 *Spillway Outflow*: ${dam.outflowCusecs.toLocaleString()} cusecs\n⏱️ *Flood Wave Arrival*: ${eta}\n🚨 *Advisory*: ${farmer.riskAssessment.actionRecommendation}\nIssued by: Mandya / Mysuru Disaster Management Authority`;
                const waUrl = `https://api.whatsapp.com/send?phone=${phoneDigits}&text=${encodeURIComponent(waMsg)}`;
                window.open(waUrl, '_blank');

                // 2. Prepare 160-char SMS text
                const smsMsg = `ALERT! ${dam.name}: Outflow ${dam.outflowCusecs.toLocaleString()} cusecs. Flood wave arrives Survey ${farmer.surveyNumber} in ${eta}. Evacuate cattle & motors! -Govt`;
                const smsUrl = `sms:${phoneDigits}?body=${encodeURIComponent(smsMsg)}`;

                // 3. Trigger Backend Real SMTP Email & SMS Gateway
                let serverResponse = null;
                let requestError = null;
                try {
                    const res = await apiFetch('/api/alerts/send-farmer-3way', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            farmerId: farmer.id,
                            phone: farmer.phone,
                            surveyNumber: farmer.surveyNumber,
                            email: farmer.email 
                        })
                    });
                    serverResponse = await res.json();
                    if (!res.ok) requestError = serverResponse.error || "Alert request failed.";
                    if (serverResponse.dispatch) {
                        setAlertLog(prev => [serverResponse.dispatch, ...prev]);
                    }
                } catch (e) {
                    console.error("Backend error:", e);
                    requestError = "Backend unavailable. Start the project using start.bat and retry.";
                }

                // Show modern glass modal confirmation
                setLastModalAlert({
                    farmerName: farmer.name,
                    phone: farmer.phone,
                    email: serverResponse?.dispatch?.channels?.email?.to || farmer.email,
                    surveyNumber: farmer.surveyNumber,
                    eta: eta,
                    waUrl: waUrl,
                    smsUrl: smsUrl,
                    smsText: smsMsg,
                    smtpStatus: serverResponse?.dispatch?.channels?.email?.detail || requestError || "No email result returned by the server.",
                    emailStatus: serverResponse?.dispatch?.channels?.email?.status || "REQUEST_FAILED",
                    smsStatus: serverResponse?.dispatch?.channels?.sms?.detail || requestError || "No SMS result returned by the server.",
                    smsProviderStatus: serverResponse?.dispatch?.channels?.sms?.status || "REQUEST_FAILED"
                });
            };

            // Mass 1-Click Broadcast
            const handle1Click3WayBroadcast = async (targetTier) => {
                setIsBroadcasting(true);
                try {
                    const res = await apiFetch('/api/alerts/broadcast-3way', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ targetZone: targetTier })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Broadcast request failed.");
                    if (data.dispatches) {
                        setAlertLog(prev => [...data.dispatches, ...prev]);
                    }
                    const smsAccepted = (data.dispatches || []).filter(d => d.channels?.sms?.status?.startsWith("TWILIO_") || d.channels?.sms?.status === "ACCEPTED_BY_FAST2SMS").length;
                    const emailAccepted = (data.dispatches || []).filter(d => d.channels?.email?.status === "ACCEPTED_BY_SMTP").length;
                    alert(`Broadcast requests processed for ${data.count || 0} farmers in ${targetTier}.\n\nSMS accepted by provider: ${smsAccepted}/${data.count || 0}\nEmail accepted by SMTP: ${emailAccepted}/${data.count || 0}\nWhatsApp links prepared: ${data.count || 0}\n\nProvider acceptance does not guarantee delivery. See Alert Logs for per-recipient errors.`);
                } catch (e) {
                    console.error(e);
                    alert(`Broadcast failed: ${e.message || "the JalSuraksha API server is not responding."}`);
                } finally {
                    setIsBroadcasting(false);
                }
            };

            // Register New Farmer
            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                if (!regForm.name || !regForm.surveyNumber) {
                    alert("Please fill in Farmer Name and Survey Number");
                    return;
                }

                const cleanName = regForm.name.trim();
                const newFarmer = {
                    id: `FARM-${Date.now().toString().slice(-4)}`,
                    name: cleanName,
                    phone: regForm.phone.trim(),
                    email: regForm.email.trim(),
                    surveyNumber: regForm.surveyNumber.trim(),
                    village: regForm.village.trim() || "Belagola Downstream",
                    cropType: regForm.cropType,
                    landAreaAcres: parseFloat(regForm.landAreaAcres),
                    latitude: parseFloat(regForm.latitude),
                    longitude: parseFloat(regForm.longitude),
                    distanceFromRiverMeters: parseInt(regForm.distanceFromRiverMeters, 10),
                    notes: regForm.notes || "Registered online"
                };

                try {
                    const res = await apiFetch('/api/farmers/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newFarmer)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Farmer registration failed.");
                    if (data.allFarmers) {
                        setFarmers(data.allFarmers);
                    } else {
                        setFarmers(prev => [newFarmer, ...prev]);
                    }
                } catch (err) {
                    alert(err.message || "Registration failed. Check that the API server is running.");
                    return;
                }

                setShowRegisterModal(false);
                setActiveTab("dashboard");
                setTimeout(() => {
                    if (leafletMap.current) {
                        leafletMap.current.flyTo([newFarmer.latitude, newFarmer.longitude], 14, {
                            animate: true,
                            duration: 1.2
                        });
                    }
                }, 250);
                alert(`✅ Farmland Registered for ${newFarmer.name}!\n\n📍 Survey No: ${newFarmer.surveyNumber}\n📱 Phone (SMS + WA): ${newFarmer.phone}\n✉️ Email (SMTP): ${newFarmer.email}\n\nCheck the GIS Map now — your farmland pin is highlighted!`);
            };

            // Quick Scenario Presets for Presentation
            const applyScenario = (type) => {
                if (type === "monsoon-red") {
                    setDam(prev => ({
                        ...prev,
                        season: "monsoon",
                        currentTmc: 48.20,
                        waterLevelMeters: 124.60,
                        inflowCusecs: 65000,
                        outflowCusecs: 55000
                    }));
                } else if (type === "monsoon-orange") {
                    setDam(prev => ({
                        ...prev,
                        season: "monsoon",
                        currentTmc: 43.10,
                        waterLevelMeters: 122.50,
                        inflowCusecs: 38000,
                        outflowCusecs: 28000
                    }));
                } else if (type === "winter-safe") {
                    setDam(prev => ({
                        ...prev,
                        season: "winter",
                        currentTmc: 45.50,
                        waterLevelMeters: 123.40,
                        inflowCusecs: 6000,
                        outflowCusecs: 4500
                    }));
                } else if (type === "summer-drought") {
                    setDam(prev => ({
                        ...prev,
                        season: "summer",
                        currentTmc: 9.80,
                        waterLevelMeters: 111.20,
                        inflowCusecs: 800,
                        outflowCusecs: 1200
                    }));
                }
            };

            const getAlertBadge = () => {
                if (evaluation.alertLevel === "RED") {
                    return (
                        <div className="flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-rose-500/20 border border-rose-500/50 text-rose-300 shadow-lg shadow-rose-500/20 animate-pulse">
                            <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                            <span className="text-xs font-black tracking-wider uppercase">RED ALERT &bull; EVACUATE FLOODPLAIN</span>
                        </div>
                    );
                } else if (evaluation.alertLevel === "ORANGE") {
                    return (
                        <div className="flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-amber-500/20 border border-amber-500/50 text-amber-300 shadow-lg shadow-amber-500/20">
                            <span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                            <span className="text-xs font-black tracking-wider uppercase">ORANGE WARNING &bull; CAUTION BUFFER</span>
                        </div>
                    );

                        {/* ============================================================ */}
                        {/* TAB 4: CIVIL HYDROLOGICAL FORMULAS & VIVA SHEET              */}
                        {/* ============================================================ */}
                        <div className={activeTab === "civil" ? "backdrop-blur-xl bg-slate-900/70 border border-slate-800/90 rounded-3xl p-6 space-y-6 shadow-2xl block" : "hidden"}>
                                <div>
                                    <h2 className="text-lg font-black text-white flex items-center space-x-2">
                                        <span>📐</span>
                                        <span>Civil Engineering Hydrology & Hydraulic Formulations</span>
                                    </h2>
                                    <p className="text-xs text-slate-400 mt-1">Mathematical equations and engineering standards implemented in this project for external examiner evaluation.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="font-bold text-sm text-cyan-400 flex items-center space-x-2">
                                            <span>1.</span>
                                            <span>Flood Wave Travel Time (Saint-Venant Celerity)</span>
                                        </div>
                                        <p className="text-slate-300 leading-relaxed">
                                            When spillway gates open, the flood wave propagates down the alluvial river channel according to the Saint-Venant shallow water wave approximation:
                                        </p>
                                        <div className="p-3 bg-slate-900 font-mono text-cyan-300 rounded-xl border border-slate-800">
                                            c = √(g · y_m) + v_0<br/>
                                            T_arrival = Distance / v_wave
                                        </div>
                                        <p className="text-slate-400">
                                            For natural alluvial river beds with bed slope S_0 ≈ 0.0006, empirical celerity ranges from <b>2.1 m/s (7.5 km/h)</b> at base discharge up to <b>3.9 m/s (14.0 km/h)</b> at 80,000+ cusecs.
                                        </p>
                                    </div>

                                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="font-bold text-sm text-cyan-400 flex items-center space-x-2">
                                            <span>2.</span>
                                            <span>Rural Telecom 160-Char GSM SMS Rationale</span>
                                        </div>
                                        <p className="text-slate-300 leading-relaxed">
                                            Why text message is critical: Most rural Indian farmers rely on basic keypad / feature phones without 4G or smartphones.
                                        </p>
                                        <div className="p-3 bg-slate-900 font-mono text-emerald-300 rounded-xl border border-slate-800">
                                            GSM 7-bit standard: Max 160 characters per packet<br/>
                                            Guarantees zero truncation on 2G rural telecom!
                                        </div>
                                    </div>

                                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="font-bold text-sm text-cyan-400 flex items-center space-x-2">
                                            <span>3.</span>
                                            <span>Haversine Great-Circle Geofencing</span>
                                        </div>
                                        <p className="text-slate-300 leading-relaxed">
                                            Calculates precise spherical distance from the dam crest to individual farmer survey plots:
                                        </p>
                                        <div className="p-3 bg-slate-900 font-mono text-cyan-300 rounded-xl border border-slate-800">
                                            a = sin²(Δφ/2) + cos φ₁ · cos φ₂ · sin²(Δλ/2)<br/>
                                            d = 2R · atan2(√a, √(1−a))
                                        </div>
                                    </div>

                                    <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="font-bold text-sm text-cyan-400 flex items-center space-x-2">
                                            <span>4.</span>
                                            <span>CWC Rule Curve & IS 7323 Code of Practice</span>
                                        </div>
                                        <p className="text-slate-300 leading-relaxed">
                                            IS 7323 Code of Practice for Reservoir Operation governs dynamic seasonal water retention:
                                        </p>
                                        <ul className="list-disc pl-4 text-slate-400 space-y-1">
                                            <li><b>Monsoon</b>: Cushion of 10-15% retained to absorb sudden flash runoff.</li>
                                            <li><b>Winter (Post-Monsoon)</b>: Storage maximized to 98% for Rabi crop command.</li>
                                            <li><b>Summer</b>: Conservation pool strictly rationed for drinking needs.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                    </main>

                    {/* CUSTOM ALERT RESULT MODAL (NO BLOCKING POPUPS!) */}
                    {lastModalAlert && (
                        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="backdrop-blur-2xl bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl animate-fadeIn">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xl">⚡</span>
                                        <h3 className="text-base font-bold text-white">1-Click 3-Way Alert Status</h3>
                                    </div>
                                    <button onClick={() => setLastModalAlert(null)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-1">
                                        <div className="font-bold text-white text-sm">{lastModalAlert.farmerName}</div>
                                        <div className="text-slate-400 font-mono">Survey No: <span className="text-cyan-300 font-bold">{lastModalAlert.surveyNumber}</span> &bull; ETA: <span className="text-rose-400 font-bold">{lastModalAlert.eta}</span></div>
                                    </div>

                                    {/* Email */}
                                    <div className="p-3 rounded-2xl bg-blue-950/40 border border-blue-800/60 space-y-1.5">
                                        <div className="font-bold text-blue-300 flex items-center justify-between">
                                            <span>✉️ Email Status (Gmail SMTP)</span>
                                            <span className="text-[10px] bg-blue-900 text-blue-200 px-1.5 py-0.5 rounded font-mono font-bold">{lastModalAlert.emailStatus}</span>
                                        </div>
                                        <div className="text-slate-200 font-mono text-[11px] truncate">To: {lastModalAlert.email}</div>
                                        <div className="text-[11px] text-slate-300 font-semibold">{lastModalAlert.smtpStatus}</div>
                                    </div>

                                    {/* WhatsApp */}
                                    <div className="p-3 rounded-2xl bg-emerald-950/40 border border-emerald-800/60 space-y-1.5">
                                        <div className="font-bold text-emerald-300 flex items-center justify-between">
                                            <span>💬 WhatsApp Status</span>
                                            <span className="text-[10px] bg-emerald-900 text-emerald-200 px-1.5 py-0.5 rounded font-mono font-bold">Direct Tab</span>
                                        </div>
                                        <div className="text-slate-300 text-[11px]">Chat tab opened in your browser for <b>{lastModalAlert.phone}</b>.</div>
                                        <a href={lastModalAlert.waUrl} target="_blank" className="block text-center py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition shadow">
                                            Open WhatsApp Chat Now 📲
                                        </a>
                                    </div>

                                    {/* SMS */}
                                    <div className="p-3 rounded-2xl bg-amber-950/40 border border-amber-800/60 space-y-1.5">
                                        <div className="font-bold text-amber-300 flex items-center justify-between">
                                            <span>📱 SMS Status (Keypad Phone)</span>
                                            <span className="text-[10px] bg-amber-900 text-amber-200 px-1.5 py-0.5 rounded font-mono font-bold">{lastModalAlert.smsProviderStatus}</span>
                                        </div>
                                        <div className="text-slate-300 font-mono text-[11px] bg-slate-900 p-2 rounded-xl border border-slate-800">
                                            "{lastModalAlert.smsText}"
                                        </div>
                                        <div className="text-[11px] text-slate-300">{lastModalAlert.smsStatus}</div>
                                        {lastModalAlert.smsProviderStatus === "NOT_CONFIGURED" && <a href={lastModalAlert.smsUrl} className="block text-center py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition shadow">Open SMS app to send manually</a>}
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <button onClick={() => setLastModalAlert(null)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition">
                                        Done
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* REGISTRATION MODAL WITH LIVE GPS DETECT */}
                    {showRegisterModal && (
                        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="backdrop-blur-2xl bg-slate-900 border border-slate-700/80 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl animate-fadeIn">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-bold text-white flex items-center space-x-2">
                                        <span>🌾</span>
                                        <span>Register Farmland Plot</span>
                                    </h3>
                                    <button onClick={() => setShowRegisterModal(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-400">
                                    Adds the landowner to the 3-Way simultaneous automated alert system and pins to the GIS Map.
                                </p>

                                <form onSubmit={handleRegisterSubmit} className="space-y-3.5 text-xs">
                                    {/* 🎯 AUTO-DETECT GPS LOCATION BUTTON */}
                                    <div className="p-3 rounded-2xl bg-gradient-to-r from-cyan-950/70 to-blue-950/70 border border-cyan-500/40 flex items-center justify-between">
                                        <div>
                                            <div className="font-bold text-cyan-300 flex items-center space-x-1.5">
                                                <span>🎯</span>
                                                <span>Live GPS Device Locator</span>
                                            </div>
                                            <div className="text-[11px] text-slate-400">Auto-fill coordinates using device sensor</div>
                                        </div>
                                        <div className="flex space-x-2">
                                            <button 
                                                type="button"
                                                disabled={gpsLoading}
                                                onClick={() => detectCurrentLocation('register')}
                                                className="px-3 py-1.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs shadow-md transition flex items-center space-x-1"
                                                title="Capture coordinates using your device/browser GPS"
                                            >
                                                <span className={gpsLoading ? "animate-spin" : ""}>📍</span>
                                                <span>{gpsLoading ? "Locating..." : "Device GPS"}</span>
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => applySimulatedLocation('register')}
                                                className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md transition flex items-center space-x-1"
                                                title="Pre-fill Belagola Downstream coordinates (1.85 km from KRS Dam) for hackathon demo"
                                            >
                                                <span>🌾</span>
                                                <span>Belagola (1.8km)</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-slate-300 font-semibold">Farmer Full Name *</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={regForm.name} 
                                                onChange={e => setRegForm({ ...regForm, name: e.target.value })}
                                                placeholder="e.g. Vinay Babannavar"
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-slate-300 font-semibold">Mobile (SMS & WhatsApp) *</label>
                                            <input 
                                                type="tel" 
                                                required 
                                                pattern="(\+91)?[6-9][0-9]{9}|91[6-9][0-9]{9}"
                                                title="Enter a valid Indian mobile number, such as +919876543210"
                                                value={regForm.phone} 
                                                onChange={e => setRegForm({ ...regForm, phone: e.target.value })}
                                                placeholder="+918971093279"
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    {/* EMAIL FIELD */}
                                    <div>
                                        <label className="text-slate-300 font-semibold flex items-center justify-between">
                                            <span>Email Address (For SMTP Real Email Alerts) *</span>
                                            <span className="text-[10px] text-cyan-400 font-normal">Sent via Gmail SMTP (.env)</span>
                                        </label>
                                        <input 
                                            type="email" 
                                            required 
                                            value={regForm.email} 
                                            onChange={e => setRegForm({ ...regForm, email: e.target.value })}
                                            placeholder="vinaybabannavar70@gmail.com"
                                            className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-cyan-300 font-mono focus:outline-none focus:border-cyan-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-slate-300 font-semibold">Land Survey Number *</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={regForm.surveyNumber} 
                                                onChange={e => setRegForm({ ...regForm, surveyNumber: e.target.value })}
                                                placeholder="e.g. 142/3"
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-cyan-300 font-mono font-bold focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-slate-300 font-semibold">Village / Taluk</label>
                                            <input 
                                                type="text" 
                                                value={regForm.village} 
                                                onChange={e => setRegForm({ ...regForm, village: e.target.value })}
                                                placeholder="e.g. Belagola Downstream"
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-slate-300 font-semibold">Crop Type</label>
                                            <select 
                                                value={regForm.cropType} 
                                                onChange={e => setRegForm({ ...regForm, cropType: e.target.value })}
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                                            >
                                                <option value="Sugarcane">Sugarcane</option>
                                                <option value="Paddy (Rice)">Paddy (Rice)</option>
                                                <option value="Banana & Turmeric">Banana & Turmeric</option>
                                                <option value="Vegetables">Vegetables</option>
                                                <option value="Floriculture">Floriculture</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-slate-300 font-semibold">Land Area (Acres)</label>
                                            <input 
                                                type="number" 
                                                step="0.1" 
                                                value={regForm.landAreaAcres} 
                                                onChange={e => setRegForm({ ...regForm, landAreaAcres: e.target.value })}
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-slate-300 font-semibold">Latitude (GPS)</label>
                                            <input 
                                                type="number" 
                                                step="0.0001" 
                                                value={regForm.latitude} 
                                                onChange={e => setRegForm({ ...regForm, latitude: e.target.value })}
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-slate-300 font-semibold">Longitude (GPS)</label>
                                            <input 
                                                type="number" 
                                                step="0.0001" 
                                                value={regForm.longitude} 
                                                onChange={e => setRegForm({ ...regForm, longitude: e.target.value })}
                                                className="w-full mt-1 p-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowRegisterModal(false)}
                                            className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-5 py-2 rounded-xl bg-gradient-to-r from-cyan-600 to-sky-600 hover:from-cyan-500 hover:to-sky-500 text-white font-bold shadow-lg shadow-cyan-600/30"
                                        >
                                            Confirm Registration & Pin to Map
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="backdrop-blur-xl bg-slate-950/80 border-t border-slate-800/80 py-4 px-6 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2">
                            <div>JalSuraksha: Smart Dam Monitoring & 3-Way Flood Early Warning System (SMS + WhatsApp + Gmail SMTP)</div>
                            <div>Department of Civil Engineering &bull; 5th Semester Capstone Project &bull; IS 7323 & CWC Compliant</div>
                        </div>
                    </footer>
                </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
